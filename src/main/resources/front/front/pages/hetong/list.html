<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>合同信息</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <style>
        :root { --ink:#1a2e4c; --muted:#5e7189; --p:#0ea5e9; --p-soft:#38bdf8; --p-light:#f0f9ff; --border:rgba(14,165,233,.10); --shadow:0 8px 32px rgba(14,165,233,.12); --shadow-sm:0 2px 12px rgba(14,165,233,.08); --radius:16px; --radius-sm:12px; --pill:999px; }
        * { box-sizing: border-box; }
        body { margin:0; background:#f5f7fa; font-family:'Microsoft YaHei','PingFang SC',sans-serif; color:var(--ink); }
        .page-shell { width:1380px; max-width:calc(100% - 48px); margin:0 auto; padding:20px 0 40px; }
        .subnav,.content-shell { background:#fff; border:1px solid #e8ecf1; border-radius:var(--radius); box-shadow:var(--shadow-sm); }
        .subnav { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px; margin-bottom:20px; }
        .subnav-brand { font-size:18px; font-weight:700; color:var(--ink); }
        .subnav-links { display:flex; flex-wrap:wrap; gap:8px; }
        .subnav-links a { display:inline-flex; align-items:center; justify-content:center; height:38px; padding:0 18px; border-radius:var(--pill); text-decoration:none; color:var(--muted); font-size:14px; font-weight:500; transition:all .2s ease; }
        .subnav-links a:hover { color:var(--p); background:var(--p-light); }
        .subnav-links a.active { color:#fff; background:var(--p); box-shadow:0 4px 12px rgba(14,165,233,.25); }
        .tab-bar { display:flex; gap:4px; margin-bottom:20px; padding:0 4px; }
        .tab-bar a { display:inline-flex; align-items:center; height:34px; padding:0 16px; border-radius:var(--pill); text-decoration:none; color:var(--muted); font-size:13px; font-weight:500; transition:all .2s ease; }
        .tab-bar a:hover { color:var(--p); background:var(--p-light); }
        .tab-bar a.active { color:var(--p); background:var(--p-light); font-weight:600; }
        .content-shell { padding:28px; }
        .section-head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; }
        .section-head h2 { margin:0; font-size:20px; font-weight:700; }
        .section-head span { color:var(--muted); font-size:14px; }
        .card-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:20px; }
        .contract-card { padding:22px; border-radius:var(--radius); background:#fff; border:1px solid #e8ecf1; box-shadow:var(--shadow-sm); transition:all .2s ease; }
        .contract-card:hover { transform:translateY(-3px); box-shadow:0 12px 32px rgba(14,165,233,.12); border-color:var(--p-soft); }
        .contract-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px; }
        .contract-title { margin:0; font-size:18px; font-weight:700; color:var(--ink); line-height:1.3; }
        .status-chip { flex-shrink:0; padding:4px 12px; border-radius:var(--pill); background:var(--p-light); color:var(--p); font-size:12px; font-weight:600; }
        .contract-text { color:var(--muted); line-height:1.8; font-size:14px; min-height:60px; }
        .contract-actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:16px; }
        .action-btn { display:inline-flex; align-items:center; justify-content:center; height:36px; padding:0 18px; border-radius:var(--radius-sm); border:0; cursor:pointer; color:#fff; background:var(--p); font-size:13px; font-weight:600; transition:background .2s; }
        .action-btn:hover { background:#0284c7; }
        .pager { margin-top:28px; text-align:center; }
        .empty-box { padding:48px 0; color:#98a8be; text-align:center; font-size:14px; }
        @media (max-width:900px) { .card-grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div id="app">
    <div class="page-shell">
        <div class="subnav">
            <div class="subnav-brand">足球俱乐部管理系统</div>
            <div class="subnav-links">
                <a href="../../index.html">首页</a>
                <a href="../gonggao/list.html">公告信息</a>
                <a href="../saishi/list.html">赛事信息</a>
                <a href="../jiaolian/list.html">教练信息</a>
                <a href="../login/login.html">个人中心</a>
            </div>
        </div>
        <div class="tab-bar">
            <a v-for="(item,index) in centerMenu" :key="index" :href="'javascript:jump(\'' + item.url + '\')'" :class="{active: item.url === '../hetong/list.html'}">{{ item.name }}</a>
        </div>
        <div class="content-shell">
            <div class="section-head"><h2>合同列表</h2><span>共 {{ total }} 份合同</span></div>
            <div class="card-grid" v-if="dataList.length">
                <div class="contract-card" v-for="(item,index) in dataList" :key="index">
                    <div class="contract-head"><h3 class="contract-title">{{ item.hetongName }}</h3><span class="status-chip">合同档案</span></div>
                    <div class="contract-text">{{ item.hetongText || '暂无备注说明' }}</div>
                    <div class="contract-actions"><button type="button" class="action-btn" v-if="item.hetongFile" @click="downloadFile(item.hetongFile)">下载合同</button></div>
                </div>
            </div>
            <div class="empty-box" v-else>暂无合同数据</div>
            <div class="pager" id="pager"></div>
        </div>
    </div>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/vue.js"></script>
<script src="../../xznstatic/js/element.min.js"></script>
<link rel="stylesheet" href="../../xznstatic/css/element.min.css">
<script src="../../js/config.js"></script>
<script src="../../modules/config.js"></script>
<script src="../../js/utils.js"></script>
<script>
var http = layui.http || { baseurl: (typeof resolveProjectBase === 'function') ? resolveProjectBase() : (window.location.protocol + '//' + window.location.host + '/') };
var vue = new Vue({
    el: '#app',
    data: { baseUrl: http.baseurl, centerMenu: centerMenu, dataList: [], total: 0, searchForm: { page: 1, limit: 8, sort: 'id', order: 'desc', hetongDeleteStart: 1, hetongDeleteEnd: 1 } },
    methods: { img: function(path) { if (!path) return ''; if (path.indexOf('http') === 0) return path; return this.baseUrl.replace(/\/$/, '') + '/upload/' + path.replace(/^.*upload\//, ''); },  jump: function(url) { jump(url); }, downloadFile: function(file) { window.open(this.baseUrl + file, '_blank'); }, fetchList: function() {} }
});
layui.use(['http', 'laypage'], function() {
    var http = layui.http; var laypage = layui.laypage; vue.baseUrl = http.baseurl; localStorage.setItem('goUtl', './pages/hetong/list.html');
    vue.fetchList = function() {
        http.request('hetong/page', 'get', vue.searchForm, function(res) {
            var data = res.data || {}; vue.dataList = data.list || []; vue.total = data.total || 0;
            laypage.render({ elem: 'pager', count: vue.total, limit: vue.searchForm.limit, curr: vue.searchForm.page, groups: 3, layout: ['prev', 'page', 'next'], jump: function(obj, first) { if (!first) { vue.searchForm.page = obj.curr; vue.fetchList(); } } });
        });
    };
    vue.fetchList();
});
</script>
</body>
</html>
