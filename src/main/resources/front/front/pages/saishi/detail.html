<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>赛事详情</title><link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/detail-showcase.css"></head>
<body><div id="app" class="detail-page"><main class="detail-container"><nav class="detail-nav"><a href="../../index.html">足球俱乐部管理系统</a><span class="detail-nav__links"><a href="./list.html">赛事列表</a></span></nav><article class="detail-showcase"><section class="detail-overview" :class="{'detail-overview--text': !showcase.cover}"><div v-if="showcase.cover" class="detail-cover-wrap"><img class="detail-cover" :src="showcase.cover" :alt="showcase.title" @error="hideImage"></div><section><span class="detail-eyebrow">{{ showcase.label }} // MATCH</span><span class="detail-badge">{{ showcase.badge }}</span><h1 class="detail-title">{{ showcase.title }}</h1><p class="detail-subtitle">查看比赛安排、地点与赛事介绍</p><div class="detail-fields"><div v-for="field in showcase.fields" :key="field.en" class="detail-field"><span class="detail-field__label">{{ field.label }} // {{ field.en }}</span><strong class="detail-field__value">{{ field.value || '暂无' }}</strong></div></div></section></section><section v-if="showcase.content" class="detail-content"><h2 class="detail-content__title">{{ showcase.contentTitle }} // DETAILS</h2><div v-html="renderContent(showcase.content)"></div></section><p v-else class="detail-content detail-empty">暂无赛事介绍</p><footer class="detail-actions"><a class="detail-action detail-action--secondary" href="./list.html">返回赛事列表</a><button class="detail-action detail-action--primary" type="button" @click="goBack">返回上一页</button></footer></article></main></div><script src="../../layui/layui.js"></script><script src="../../js/vue.js"></script><script src="../../js/config.js"></script><script src="../../modules/config.js"></script><script src="../../js/detail-showcase.js"></script><script>var moduleName='saishi';var vue=new Vue({el:'#app',data:{baseUrl:'',detail:{}},computed:{showcase:function(){return DetailShowcase.get(moduleName,this.detail,this.baseUrl)}},methods:{goBack:function(){history.back()},hideImage:function(e){e.target.parentNode.style.display='none'},renderContent:function(c){return layui.http&&layui.http.fixRichTextImages?layui.http.fixRichTextImages(c,this.baseUrl):c}}});layui.use(['http'],function(){var http=layui.http;vue.baseUrl=http.baseurl;http.request(moduleName+'/info/'+http.getParam('id'),'get',{},function(res){vue.detail=res.data||{}})})</script></body></html>
