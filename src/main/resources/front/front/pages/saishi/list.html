<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>赛事信息</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <style>
        :root { --ink:#1a2e4c; --muted:#5e7189; --p:#0ea5e9; --p-soft:#38bdf8; --p-light:#f0f9ff; --border:rgba(14,165,233,.10); --shadow:0 8px 32px rgba(14,165,233,.12); --shadow-sm:0 2px 12px rgba(14,165,233,.08); --radius:16px; --radius-sm:12px; --pill:999px; }
        * { box-sizing:border-box; }
        body { margin:0; background:#f5f7fa; font-family:'Microsoft YaHei','PingFang SC',sans-serif; color:var(--ink); }
        .page-shell { width:1380px; max-width:calc(100% - 48px); margin:0 auto; padding:20px 0 40px; }
        .subnav,.toolbar,.list-shell { background:#fff; border:1px solid #e8ecf1; border-radius:var(--radius); box-shadow:var(--shadow-sm); }
        .subnav { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px; margin-bottom:20px; }
        .subnav-brand { font-size:18px; font-weight:700; color:var(--ink); }
        .subnav-links { display:flex; flex-wrap:wrap; gap:8px; }
        .subnav-links a { display:inline-flex; align-items:center; justify-content:center; height:38px; padding:0 18px; border-radius:var(--pill); text-decoration:none; color:var(--muted); font-size:14px; font-weight:500; transition:all .2s ease; }
        .subnav-links a:hover { color:var(--p); background:var(--p-light); }
        .subnav-links a.active { color:#fff; background:var(--p); box-shadow:0 4px 12px rgba(14,165,233,.25); }
        .toolbar,.list-shell { margin-top:20px; }
        .toolbar { padding:20px 28px; }
        .toolbar-top { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
        .type-chip { display:inline-flex; align-items:center; justify-content:center; min-height:36px; padding:0 16px; border-radius:var(--pill); border:1px solid var(--border); background:#fff; color:var(--muted); font-size:13px; font-weight:500; cursor:pointer; transition:all .2s ease; }
        .type-chip.active,.type-chip:hover { color:#fff; border-color:transparent; background:var(--p); box-shadow:0 4px 12px rgba(14,165,233,.2); }
        .toolbar-form { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
        .toolbar-form .layui-input { width:320px; height:44px; border-radius:var(--radius-sm); border:1px solid #d1d5db; background:#fff; padding:0 16px; font-size:14px; }
        .toolbar-form .layui-input:focus { border-color:var(--p); outline:none; box-shadow:0 0 0 3px rgba(14,165,233,.1); }
        .toolbar-btn { height:44px; padding:0 24px; border:0; border-radius:var(--radius-sm); color:#fff; background:var(--p); font-size:14px; font-weight:600; cursor:pointer; transition:background .2s; }
        .toolbar-btn:hover { background:#0284c7; }
        .list-shell { padding:28px; }
        .section-head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; }
        .section-head h2 { margin:0; font-size:20px; font-weight:700; }
        .section-head span { color:var(--muted); font-size:14px; }
        .match-grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:24px; }
        .match-card { overflow:hidden; border-radius:var(--radius); background:#fff; border:1px solid #e8ecf1; cursor:pointer; transition:all .2s ease; box-shadow:var(--shadow-sm); }
        .match-card:hover { transform:translateY(-4px); box-shadow:0 12px 32px rgba(14,165,233,.15); border-color:var(--p-soft); }
        .match-cover { width:100%; height:200px; object-fit:cover; display:block; }
        .match-body { padding:20px; }
        .match-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px; }
        .match-title { margin:0; font-size:18px; font-weight:700; color:var(--ink); line-height:1.3; }
        .type-badge { flex-shrink:0; padding:5px 12px; border-radius:var(--pill); background:var(--p-light); color:var(--p); font-size:12px; font-weight:600; }
        .match-meta { color:var(--muted); line-height:1.8; font-size:14px; }
        .pager { margin-top:28px; text-align:center; }
        .empty-box { padding:48px 0; color:#98a8be; text-align:center; font-size:14px; }
        @media (max-width:1000px) { .match-grid { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
        @media (max-width:720px) { .match-grid { grid-template-columns:1fr; } .toolbar-form .layui-input { width:100%; } }
    </style>
</head>
<body>
<div id="app">
    <div class="page-shell">
        <div class="subnav">
            <div class="subnav-brand">足球俱乐部管理系统</div>
            <div class="subnav-links">
                <a href="../../index.html">首页</a>
                <a href="../gonggao/list.html">公告信息</a>
                <a href="../saishi/list.html">赛事信息</a>
                <a href="../jiaolian/list.html">教练信息</a>
                <a href="../login/login.html">个人中心</a>
            </div>
        </div>
       
        <div class="toolbar">
            <div class="toolbar-top">
                <div class="type-chip" :class="{active: !searchForm.saishiTypes}" @click="setType('')">全部类型</div>
                <div class="type-chip" v-for="(item,index) in saishiTypesList" :key="index" :class="{active: String(searchForm.saishiTypes) === String(item.codeIndex)}" @click="setType(item.codeIndex)">{{ item.indexName }}</div>
            </div>
            <div class="toolbar-form">
                <input type="text" v-model="searchForm.saishiName" class="layui-input" placeholder="请输入赛事名称">
                <button type="button" class="toolbar-btn" @click="search">搜索赛事</button>
            </div>
        </div>
        <div class="list-shell">
            <div class="section-head"><h2>赛事列表</h2><span>共 {{ total }} 条赛事</span></div>
            <div class="match-grid" v-if="dataList.length">
                <div class="match-card" v-for="(item,index) in dataList" :key="index" @click="jump('../saishi/detail.html?id=' + item.id)">
                    <img class="match-cover" :src="safeImage(item.img || item.saishiPhoto, placeholderMatch)" alt="赛事图片" @error="onImageError($event)">
                    <div class="match-body">
                        <div class="match-head">
                            <h3 class="match-title">{{ item.saishiName }}</h3>
                            <span class="type-badge">{{ item.saishiValue || '未分类' }}</span>
                        </div>
                        <div class="match-meta">赛事地点：{{ item.saishiAddress || '待定' }}</div>
                        <div class="match-meta">比赛时间：{{ item.insertTime || '暂无时间' }}</div>
                    </div>
                </div>
            </div>
            <div class="empty-box" v-else>暂无赛事数据</div>
            <div class="pager" id="pager"></div>
        </div>
    </div>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/vue.js"></script>
<script src="../../xznstatic/js/element.min.js"></script>
<link rel="stylesheet" href="../../xznstatic/css/element.min.css">
<script src="../../js/config.js"></script>
<script src="../../modules/config.js"></script>
<script src="../../js/utils.js"></script>
<script>
var placeholderMatch = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400"><rect width="800" height="400" fill="#eef4fb"/><circle cx="400" cy="200" r="80" fill="none" stroke="#c5d9ed" stroke-width="3"/><circle cx="400" cy="200" r="8" fill="#c5d9ed"/><line x1="0" y1="200" x2="800" y2="200" stroke="#c5d9ed" stroke-width="2"/><rect x="0" y="100" width="120" height="200" fill="none" stroke="#c5d9ed" stroke-width="2"/><rect x="680" y="100" width="120" height="200" fill="none" stroke="#c5d9ed" stroke-width="2"/><text x="400" y="360" font-size="18" text-anchor="middle" font-family="sans-serif" fill="#98aec5">暂无赛事图片</text></svg>');
var runtimeBaseUrl = (typeof resolveProjectBase === 'function') ? resolveProjectBase() : (window.location.protocol + '//' + window.location.host);
var http = layui.http || { baseurl: (typeof resolveProjectBase === 'function' ? resolveProjectBase() : (window.location.protocol + '//' + window.location.host + '/')) };
var vue = new Vue({ el:'#app', data:{ baseUrl: http.baseurl, placeholderMatch: placeholderMatch, saishiTypesList:[], dataList:[], total:0, searchForm:{ page:1, limit:9, sort:'id', order:'desc', saishiDeleteStart:1, saishiDeleteEnd:1, saishiName:'', saishiTypes:'' } }, methods: { img: function(path) { if (!path) return ''; if (path.indexOf('http') === 0) return path; return this.baseUrl.replace(/\/$/, '') + '/upload/' + path.replace(/^.*upload\//, ''); },  jump:function(url){ jump(url); }, safeImage:function(url, fallback){ var value = url; var base = this.baseUrl || runtimeBaseUrl; if (!value) { return fallback || placeholderMatch; } value = String(value).trim(); if (/^(https?:|data:|blob:)/i.test(value)) { return value; } if (value.indexOf('//') === 0) { return (window.location.protocol || 'http:') + value; } if (typeof resolveImage === 'function') { return resolveImage(value, base); } base = String(base || '').replace(/\/+$/, ''); value = value.replace(/^\.?\//, ''); return base + '/' + value; }, onImageError:function(event){ var image = event.target; if (image.dataset.fallbackApplied === '1') return; image.dataset.fallbackApplied = '1'; image.src = this.placeholderMatch; }, setType:function(type){ this.searchForm.saishiTypes = type; this.searchForm.page = 1; this.fetchList(); }, search:function(){ this.searchForm.page = 1; this.fetchList(); }, fetchList:function(){} } });
layui.use(['http','laypage'], function() {
    var http = layui.http;
    var laypage = layui.laypage;
    vue.baseUrl = (http && http.baseurl) ? http.baseurl : vue.baseUrl;
    localStorage.setItem('goUtl', './pages/saishi/list.html');
    http.request('dictionary/page', 'get', { page:1, limit:100, dicCode:'saishi_types' }, function(res) { vue.saishiTypesList = (res.data && res.data.list) || []; });
    vue.fetchList = function() {
        http.request('saishi/page', 'get', vue.searchForm, function(res) {
            var data = res.data || {};
            vue.dataList = data.list || [];
            vue.total = data.total || 0;
            laypage.render({ elem:'pager', count:vue.total, limit:vue.searchForm.limit, curr:vue.searchForm.page, groups:3, layout:['prev','page','next'], jump:function(obj, first){ if (!first) { vue.searchForm.page = obj.curr; vue.fetchList(); } } });
        });
    };
    vue.fetchList();
});
</script>
</body>
</html>
