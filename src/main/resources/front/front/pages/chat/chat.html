<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>AI 智能咨询</title>
    <style>
        :root {
            --ink: #172033;
            --muted: #637083;
            --line: #dbe5ef;
            --panel: #ffffff;
            --bg: #eef3f8;
            --primary: #0f8f69;
            --primary-dark: #0a6f53;
            --accent: #f2b84b;
            --danger: #b94343;
            --shadow: 0 14px 38px rgba(20, 38, 60, .12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            color: var(--ink);
            background:
                linear-gradient(120deg, rgba(15, 143, 105, .10), rgba(242, 184, 75, .12)),
                var(--bg);
        }

        .page-shell {
            width: 980px;
            max-width: calc(100% - 24px);
            margin: 0 auto;
            padding: 20px 0;
        }

        .topbar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
        }

        .home-link {
            color: var(--primary-dark);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .chat-panel {
            height: calc(100vh - 96px);
            min-height: 560px;
            display: grid;
            grid-template-rows: auto 1fr auto;
            overflow: hidden;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .chat-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .chat-title h1 {
            margin: 0;
            font-size: 22px;
            line-height: 1.3;
        }

        .chat-title p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .status {
            flex: 0 0 auto;
            padding: 7px 11px;
            border-radius: 999px;
            background: #ecf8f3;
            color: var(--primary-dark);
            font-size: 12px;
            font-weight: 700;
        }

        .messages {
            overflow-y: auto;
            padding: 22px;
            background:
                linear-gradient(rgba(255,255,255,.86), rgba(255,255,255,.86)),
                repeating-linear-gradient(0deg, transparent 0, transparent 31px, rgba(23,32,51,.035) 32px);
        }

        .message {
            display: flex;
            margin-bottom: 16px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: min(680px, 86%);
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            background: #fff;
        }

        .message.user .bubble {
            color: #fff;
            background: var(--primary);
            border-color: var(--primary);
        }

        .message.error .bubble {
            color: var(--danger);
            border-color: rgba(185, 67, 67, .25);
            background: #fff7f7;
        }

        .composer {
            padding: 16px;
            border-top: 1px solid var(--line);
            background: #fbfdff;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 96px;
            gap: 12px;
        }

        textarea {
            width: 100%;
            min-height: 72px;
            max-height: 150px;
            resize: vertical;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px;
            color: var(--ink);
            font: inherit;
            line-height: 1.6;
            outline: none;
            background: #fff;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 143, 105, .12);
        }

        button {
            border: 0;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button:disabled {
            cursor: not-allowed;
            background: #9aa9b7;
        }

        .hint-row {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: var(--muted);
            font-size: 12px;
        }

        .quick-asks {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick-asks a {
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 720px) {
            .chat-panel {
                height: calc(100vh - 80px);
                min-height: 520px;
            }

            .chat-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .input-row {
                grid-template-columns: 1fr;
            }

            button {
                height: 44px;
            }
        }
    </style>
</head>
<body>
<div class="page-shell">
    <div class="topbar">
        <div class="brand">足球俱乐部管理系统</div>
        <a class="home-link" href="../../index.html">返回首页</a>
    </div>

    <main class="chat-panel">
        <header class="chat-header">
            <div class="chat-title">
                <h1>AI 智能咨询</h1>
                <p>可以咨询足球规则、训练建议、俱乐部业务流程，也可以作为项目演示里的智能问答入口。</p>
            </div>
            <div class="status" id="status">在线</div>
        </header>

        <section class="messages" id="messages">
            <div class="message assistant">
                <div class="bubble">你好，我是足球俱乐部管理系统的 AI 助手。你可以问我足球规则、训练安排建议，或这个系统里的功能怎么用。</div>
            </div>
        </section>

        <footer class="composer">
            <div class="input-row">
                <textarea id="messageInput" placeholder="输入你的问题，例如：介绍一下足球比赛的越位规则"></textarea>
                <button id="sendBtn" type="button">发送</button>
            </div>
            <div class="hint-row">
                <div class="quick-asks">
                    <a href="javascript:void(0)" data-question="介绍一下足球比赛的越位规则">越位规则</a>
                    <a href="javascript:void(0)" data-question="给我一份青少年球员基础训练建议">训练建议</a>
                    <a href="javascript:void(0)" data-question="这个足球俱乐部管理系统适合写进简历吗">简历亮点</a>
                </div>
                <div>Enter 发送，Shift + Enter 换行</div>
            </div>
        </footer>
    </main>
</div>

<script>
    (function () {
        var input = document.getElementById('messageInput');
        var sendBtn = document.getElementById('sendBtn');
        var messages = document.getElementById('messages');
        var status = document.getElementById('status');

        function resolveBaseUrl() {
            var parts = window.location.pathname.split('/');
            var context = parts.length > 1 ? parts[1] : '';
            return window.location.protocol + '//' + window.location.host + (context ? '/' + context : '');
        }

        function appendMessage(role, text) {
            var item = document.createElement('div');
            item.className = 'message ' + role;
            var bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            item.appendChild(bubble);
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
            return item;
        }

        function setLoading(loading) {
            sendBtn.disabled = loading;
            sendBtn.textContent = loading ? '等待中' : '发送';
            status.textContent = loading ? '思考中' : '在线';
        }

        function ask(message) {
            var text = (message || input.value || '').trim();
            if (!text) {
                appendMessage('error', '请输入问题。');
                return;
            }

            appendMessage('user', text);
            input.value = '';
            setLoading(true);

            fetch(resolveBaseUrl() + '/ai/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: text })
            })
                .then(function (response) {
                    return response.json();
                })
                .then(function (result) {
                    if (result && result.code === 0 && result.data) {
                        appendMessage('assistant', result.data.reply || 'AI 服务暂时没有返回内容。');
                    } else {
                        appendMessage('error', (result && result.msg) || '请求失败，请稍后再试。');
                    }
                })
                .catch(function () {
                    appendMessage('error', '无法连接 AI 服务，请确认后端应用已经启动。');
                })
                .finally(function () {
                    setLoading(false);
                    input.focus();
                });
        }

        sendBtn.addEventListener('click', function () {
            ask();
        });

        input.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                ask();
            }
        });

        document.querySelectorAll('[data-question]').forEach(function (item) {
            item.addEventListener('click', function () {
                ask(item.getAttribute('data-question'));
            });
        });

        input.focus();
    })();
</script>
</body>
</html>
