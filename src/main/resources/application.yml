# Tomcat
server:
    tomcat:
        uri-encoding: UTF-8
    port: 8080
    servlet:
        context-path: /zuqiujulebguanli

spring:
    main:
        banner-mode: "off"
        log-startup-info: true
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 3000
    datasource:
        driverClassName: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://127.0.0.1:3306/zuqiujulebguanli?useUnicode=true&characterEncoding=utf-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&useSSL=false
        username: root
        password: 123456


    servlet:
      multipart:
        max-file-size: 1000MB
        max-request-size: 1000MB
    resources:
      static-locations: classpath:front/,classpath:static/,file:static/,file:upload/
#mybatis
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  # 实体扫描，多个 package 用逗号或分号分隔
  typeAliasesPackage: com.entity
  global-config:
    # 主键类型 0:"数据库ID自增", 1:"用户输入ID", 2:"全局唯一ID(数字类型唯一ID)", 3:"全局唯一ID UUID"
    id-type: 1
    # 字段策略 0:"忽略判断", 1:"非 NULL 判断", 2:"非空判断"
    field-strategy: 2
    # 驼峰下划线转换
    db-column-underline: true
    # 刷新 mapper 调试神器
    refresh-mapper: false
    # 逻辑删除配置
    logic-delete-value: -1
    logic-not-delete-value: 0
    # 自定义 SQL 注入器
    sql-injector: com.baomidou.mybatisplus.mapper.LogicSqlInjector
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    # Spring Boot 项目 MyBatis-Plus 设置 jdbcTypeForNull，Oracle 数据库需配置 JdbcType.NULL，默认是 Other
    jdbc-type-for-null: 'null'

# 打印 SQL 语句
logging:
  level:
    root: info
    com.dao: warn
    com.zuqiujulebguanli.listener: warn
    com.service.DictionaryCacheService: info
    com.zaxxer.hikari: warn
    org.apache.catalina.core.StandardService: warn
    org.apache.catalina.core.StandardEngine: warn
    org.apache.catalina.core.ContainerBase: warn
    org.springframework.web.context.ContextLoader: warn
    org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLoggingListener: warn


