# Tomcat
server:
    tomcat:
        uri-encoding: UTF-8
    port: 8080
    servlet:
        context-path: /zuqiujulebguanli

spring:
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}
    main:
        banner-mode: "off"
        log-startup-info: true
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3000
    datasource:
        driverClassName: com.mysql.cj.jdbc.Driver
        url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/zuqiujulebguanli?useUnicode=true&characterEncoding=utf-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&useSSL=false}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:}
    servlet:
      multipart:
        max-file-size: ${UPLOAD_MAX_FILE_SIZE:20MB}
        max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:20MB}
    web:
      resources:
        static-locations: file:static/,classpath:front/,classpath:static/,file:upload/

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.entity
  global-config:
    db-config:
      id-type: input
      table-underline: true
      logic-delete-value: -1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'

logging:
  level:
    root: info
    com.dao: warn
    com.zuqiujulebguanli.listener: warn
    com.service.DictionaryCacheService: info
    com.filter.RequestLoggingFilter: info
    com.service.ai: info
    com.zaxxer.hikari: warn
    org.apache.catalina.core.StandardService: warn
    org.apache.catalina.core.StandardEngine: warn
    org.apache.catalina.core.ContainerBase: warn
    org.springframework.web.context.ContextLoader: warn
    org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLoggingListener: warn

ai:
  api-key: ${DEEPSEEK_API_KEY:}
  api-url: ${AI_API_URL:https://api.deepseek.com/chat/completions}
  model: ${AI_MODEL:deepseek-chat}
  timeout: ${AI_TIMEOUT:30000}
  http-referer: ${AI_HTTP_REFERER:http://localhost:8080}
  rate-limit:
    max-requests: ${AI_RATE_LIMIT_MAX:20}
    window-seconds: ${AI_RATE_LIMIT_WINDOW:60}

upload:
  allowed-extensions: jpg,jpeg,png,gif,webp,pdf,doc,docx,xls,xlsx
