<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Ohana 俱乐部 | 用户注册</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <style>
        :root {
            --sky-light: #e0f2fe;
            --stitch-blue: #0ea5e9;
            --deep-ocean: #075985;
            --leaf-green: #34d399;
            --glass: rgba(255, 255, 255, 0.8);
        }

        * {
            box-sizing: border-box;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px 12px;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--sky-light);
            overflow: hidden;
            position: relative;
        }

        .leaf-container {
            position: absolute;
            z-index: 2;
            pointer-events: none;
        }

        .palm-leaf {
            font-size: 160px;
            color: var(--leaf-green);
            opacity: 0.3;
            transform-origin: bottom center;
            animation: sway_slow 6s ease-in-out infinite alternate;
        }

        @keyframes sway_slow {
            0% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(10deg) scale(1.02); }
            100% { transform: rotate(-3deg) scale(1); }
        }

        @keyframes sway_fast {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-15deg); }
            100% { transform: rotate(5deg); }
        }

        .ocean {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25%;
            background: #bae6fd;
            z-index: 1;
        }

        .wave {
            position: absolute;
            bottom: 100%;
            width: 200%;
            height: 80px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23bae6fd" d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,144C672,139,768,181,864,181.3C960,181,1056,139,1152,122.7C1248,107,1344,117,1392,122.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>');
            background-size: 50% 100%;
            animation: waveFlow 12s linear infinite;
        }

        .wave:nth-child(2) {
            opacity: 0.5;
            height: 100px;
            bottom: 90%;
            animation: waveFlow 8s linear infinite reverse;
        }

        @keyframes waveFlow {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        #app {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 760px;
        }

        .register-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 48px 36px 34px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 30px 60px rgba(14, 165, 233, 0.15);
            animation: cardFloat 6s ease-in-out infinite;
            max-height: calc(100vh - 48px);
            overflow: auto;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .stitch-avatar {
            width: 100px;
            height: 85px;
            background: var(--stitch-blue);
            margin: -92px auto 20px;
            border-radius: 45% 45% 50% 50%;
            position: relative;
            box-shadow: 0 15px 35px rgba(14, 165, 233, 0.4);
        }

        .stitch-avatar::before,
        .stitch-avatar::after {
            content: "";
            position: absolute;
            top: 5px;
            width: 55px;
            height: 40px;
            background: var(--stitch-blue);
            border-radius: 50%;
            z-index: -1;
        }

        .stitch-avatar::before {
            left: -35px;
            transform: rotate(-35deg);
            border-left: 8px solid #0284c7;
        }

        .stitch-avatar::after {
            right: -35px;
            transform: rotate(35deg);
            border-right: 8px solid #0284c7;
        }

        .stitch-avatar .eyes {
            display: flex;
            justify-content: space-around;
            padding-top: 30px;
        }

        .stitch-avatar .eye {
            width: 22px;
            height: 28px;
            background: #1e293b;
            border-radius: 50%;
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .header h1 {
            margin: 0 0 8px;
            color: var(--deep-ocean);
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .header p {
            margin: 0;
            color: #64748b;
            font-size: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-grid .full {
            grid-column: 1 / -1;
        }

        .layui-form-item {
            margin-bottom: 0;
        }

        .layui-input,
        .layui-form-select .layui-input {
            border-radius: 16px !important;
            border: 1.5px solid #e2e8f0 !important;
            height: 52px !important;
            background: rgba(255, 255, 255, 0.6) !important;
            padding-left: 20px !important;
            font-size: 14px;
        }

        .layui-input:focus,
        .layui-form-selected .layui-input {
            border-color: var(--stitch-blue) !important;
            background: #fff !important;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1) !important;
        }

        .layui-form-select dl {
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #dbeafe;
        }

        .submit-btn {
            width: 100%;
            height: 55px;
            background: var(--stitch-blue);
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(14, 165, 233, 0.25);
            margin-top: 2px;
        }

        .submit-btn:hover {
            background: var(--deep-ocean);
            transform: scale(1.01);
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
        }

        .footer a {
            color: var(--stitch-blue);
            font-weight: 600;
            text-decoration: none;
            margin: 0 6px;
        }

        .footer .divider {
            color: #cbd5e1;
        }

        @media (max-width: 760px) {
            body {
                align-items: flex-start;
                overflow-y: auto;
            }

            .register-card {
                border-radius: 28px;
                padding: 42px 18px 24px;
                max-height: none;
                margin-top: 24px;
                animation: none;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
<div class="ocean">
    <div class="wave"></div>
    <div class="wave"></div>
</div>

<div class="leaf-container" style="top:10%; left:5%;">
    <div class="palm-leaf" style="font-size:120px; color:#10b981; animation:sway_slow 7s ease-in-out infinite;">🌿</div>
</div>
<div class="leaf-container" style="bottom:20%; right:3%;">
    <div class="palm-leaf" style="font-size:200px; animation:sway_slow 5s ease-in-out infinite reverse;">🌴</div>
</div>
<div class="leaf-container" style="top:-50px; right:20%;">
    <div class="palm-leaf" style="font-size:100px; opacity:0.2; animation:sway_fast 8s ease-in-out infinite;">🌿</div>
</div>

<div id="app">
    <div class="register-card">
        <div class="stitch-avatar">
            <div class="eyes">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
        </div>

        <div class="header">
            <h1>加入 Ohana</h1>
            <p>填写信息后即可创建用户账号并返回登录</p>
        </div>

        <form id="registerForm" class="layui-form">
            <div class="form-grid">
                <div class="layui-form-item"><input type="text" name="username" required lay-verify="required" placeholder="通行账号" autocomplete="off" class="layui-input"></div>
                <div class="layui-form-item"><input type="text" name="yonghuName" required lay-verify="required" placeholder="用户姓名" autocomplete="off" class="layui-input"></div>
                <div class="layui-form-item"><input type="password" name="password" id="password" required lay-verify="required" placeholder="安全密码" autocomplete="off" class="layui-input"></div>
                <div class="layui-form-item"><input type="password" name="password2" id="password2" required lay-verify="required" placeholder="确认密码" autocomplete="off" class="layui-input"></div>
                <div class="layui-form-item"><input type="text" name="yonghuPhone" required lay-verify="required" placeholder="手机号" autocomplete="off" class="layui-input"></div>
                <div class="layui-form-item"><input type="text" name="yonghuIdNumber" required lay-verify="required" placeholder="身份证号" autocomplete="off" class="layui-input"></div>
                <div class="layui-form-item"><select name="sexTypes" lay-verify="required"><option value="">请选择性别</option><option v-for="(item,index) in sexTypesList" :key="index" :value="item.codeIndex">{{ item.indexName }}</option></select></div>
                <div class="layui-form-item"><input type="text" name="yonghuEmail" required lay-verify="required" placeholder="邮箱" autocomplete="off" class="layui-input"></div>
                <div class="layui-form-item full"><button class="submit-btn" lay-submit lay-filter="register">申请加入</button></div>
            </div>
        </form>

        <div class="footer">
            已有通行证？<a href="../login/login.html">返回登录</a><span class="divider">|</span><a href="../jiaolian/register.html?tablename=jiaolian">教练注册</a>
        </div>
    </div>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/vue.js"></script>
<script src="../../xznstatic/js/element.min.js"></script>
<link rel="stylesheet" href="../../xznstatic/css/element.min.css">
<script src="../../js/config.js"></script>
<script src="../../modules/config.js"></script>
<script src="../../js/validate.js"></script>
<script>
var http = layui.http || { baseurl: (typeof resolveProjectBase === 'function' ? resolveProjectBase() : (window.location.protocol + '//' + window.location.host + '/')) };
var vue = new Vue({ el:'#app', data: { baseUrl: http.baseurl, sexTypesList:[] } });
layui.use(['layer', 'form', 'http'], function() {
    var layer = layui.layer;
    var form = layui.form;
    var http = layui.http;
    var tablename = http.getParam('tablename') || 'yonghu';
    http.request('dictionary/page', 'get', { page:1, limit:100, dicCode:'sex_types' }, function(res) {
        vue.sexTypesList = (res.data && res.data.list) || [];
        vue.$nextTick(function() { form.render('select'); });
    });
    form.on('submit(register)', function(data) {
        var formData = data.field;
        if (formData.password !== formData.password2) { layer.msg('两次输入的密码不一致', { time:2000, icon:5 }); return false; }
        if (!isMobile(formData.yonghuPhone)) { layer.msg('请输入正确的手机号', { time:2000, icon:5 }); return false; }
        if (!isIdentity(formData.yonghuIdNumber)) { layer.msg('请输入正确的身份证号', { time:2000, icon:5 }); return false; }
        if (!isEmail(formData.yonghuEmail)) { layer.msg('请输入正确的邮箱', { time:2000, icon:5 }); return false; }
        delete formData.password2;
        http.requestJson(tablename + '/register', 'post', formData, function() {
            layer.msg('Aloha! 注册成功', { time:1500, icon:6 }, function() { window.location.href = '../login/login.html'; });
        });
        return false;
    });
});
</script>
</body>
</html>
